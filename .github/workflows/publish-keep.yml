name: publish-keep

# keep (keep/) -> JSR (@techgoose-labs/rune). The runtime library publish.
#
# The Claude skill is folded into the rune skills (claude/skills/rune:*, shipped with
# the rune release), so this workflow no longer ships a skill or a `keep-latest`
# GitHub release — it is a pure JSR publish. The JSR reusable auto-bumps
# keep/deno.json and commits "release: vX (auto-bump)" back to main; that commit
# touches only keep/** so it re-enters HERE as an idempotent no-op (version
# already published) and does NOT rebuild rune.
on:
  push:
    branches: [main]
    paths:
      - "keep/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task setup
      - run: deno test -A src/rune/ keep/ e2e/

  publish:
    needs: test
    uses: techgoose-labs/actions/.github/workflows/jsr-publish.yml@main
    with:
      working-directory: keep
    secrets:
      JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
